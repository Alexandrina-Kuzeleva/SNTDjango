{% extends 'sntapp/base.html' %}
{% block title %}Контакты{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12">
    <div class="max-w-6xl mx-auto">
        <!-- Title -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">{{ page.title }}</h1>
            <div class="w-24 h-1 bg-snt-green mx-auto"></div>
        </div>
        
        <div class="grid lg:grid-cols-1 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <!-- Content -->
                <div class="bg-white rounded-xl shadow-md p-8">
                    <div class="prose prose-lg max-w-none">
                        {{ page.content|safe }}
                    </div>
                </div>
                
                <!-- Map -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden">
                    <div class="bg-gray-100 p-4 border-b">
                        <h3 class="font-bold text-gray-800"><i class="fas fa-map-marked-alt text-snt-green mr-2"></i> Мы на карте</h3>
                    </div>
                    <div class="h-96">
                        <iframe 
                            src="https://yandex.ru/map-widget/v1/?ll=38.684915,55.447116&z=15&pt=38.684915,55.447116,pm2rdm&whatshere%5Bpoint%5D=38.684915,55.447116&whatshere%5Bzoom%5D=15&mode=whatshere"
                            width="100%" 
                            height="400" 
                            frameborder="0">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
