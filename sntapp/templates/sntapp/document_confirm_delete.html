{% extends 'sntapp/base.html' %}
{% block title %}Удаление документа{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="bg-red-500 p-6">
                <h2 class="text-2xl font-bold text-white text-center">Удаление документа</h2>
            </div>
            
            <div class="p-6 text-center">
                <i class="fas fa-exclamation-triangle text-red-500 text-5xl mb-4"></i>
                <p class="text-gray-800 mb-4">Вы уверены, что хотите удалить документ</p>
                <p class="font-bold text-gray-900 mb-6">"{{ document.title }}"?</p>
                <p class="text-sm text-gray-500 mb-6">Это действие нельзя отменить.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="flex gap-3">
                        <button type="submit" class="flex-1 bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition">
                            <i class="fas fa-trash"></i> Да, удалить
                        </button>
                        <a href="{% url 'documents' %}" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-center hover:bg-gray-300 transition">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
