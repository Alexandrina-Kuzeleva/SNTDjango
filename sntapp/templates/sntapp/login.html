{% extends 'sntapp/base.html' %}
{% block title %}Вход в личный кабинет{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <i class="fas fa-tree text-5xl text-snt-green"></i>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900">Вход в личный кабинет</h2>
            <p class="mt-2 text-sm text-gray-600">СНТ "Ивушка"</p>
        </div>
        
        <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded-lg">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <i class="fas fa-info-circle text-green-500"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-green-800">
                        <strong>Внимание!</strong> Для входа используйте <strong>номер вашего участка</strong> в качестве логина.
                    </p>
                </div>
            </div>
        </div>
        
        <form class="mt-8 space-y-6" method="post">
            {% csrf_token %}
            <div class="rounded-md shadow-sm space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                        Номер участка (логин)
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-map-marker-alt text-gray-400"></i>
                        </div>
                        <input type="text" id="username" name="username" required 
                               class="appearance-none rounded-lg relative block w-full pl-10 px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-snt-green focus:border-snt-green focus:z-10 sm:text-sm"
                               placeholder="Введите номер участка">
                    </div>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        Пароль
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" name="password" required 
                               class="appearance-none rounded-lg relative block w-full pl-10 px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-snt-green focus:border-snt-green focus:z-10 sm:text-sm"
                               placeholder="Введите пароль">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-snt-green to-snt-light hover:from-snt-dark hover:to-snt-green focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-snt-green transition">
                    Войти
                </button>
            </div>
        </form>
        
        <div class="text-center">
            <p class="text-sm text-gray-600">
                Нет аккаунта? 
                <a href="{% url 'register' %}" class="font-medium text-snt-green hover:text-snt-dark">Зарегистрируйтесь</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
